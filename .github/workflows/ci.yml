name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Clean examples pass
        run: node bin/n8n-workflow-lint.js examples/clean-lead-intake.json examples/ai-support-agent.json
      - name: Risky example fails
        run: |
          if node bin/n8n-workflow-lint.js examples/risky-lead-intake.json; then
            echo "expected a non-zero exit code"; exit 1
          fi
